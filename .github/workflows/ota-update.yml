name: EAS OTA Update

on:
  push:
    branches:
      - main
      - preview

jobs:
  update:
    name: Publish OTA Update
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Verify Expo token is configured
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is missing. Add it in GitHub Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "EXPO_TOKEN is present."
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update (production)
        if: github.ref == 'refs/heads/main'
        run: eas update --branch main --channel production --message "$UPDATE_MESSAGE"
        env:
          CI: "1"
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          UPDATE_MESSAGE: ${{ github.event.head_commit.message }}

      - name: Publish OTA update (preview)
        if: github.ref == 'refs/heads/preview'
        run: eas update --branch preview --channel preview --message "$UPDATE_MESSAGE"
        env:
          CI: "1"
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          UPDATE_MESSAGE: ${{ github.event.head_commit.message }}
