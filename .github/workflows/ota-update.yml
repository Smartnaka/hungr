name: EAS OTA Update

on:
  push:
    branches:
      - main
      - preview

jobs:
  update:
    name: Publish OTA Update
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Verify and normalize Expo token
        run: |
          CLEAN_EXPO_TOKEN="$(printf "%s" "$EXPO_TOKEN" | tr -d '\r\n')"

          if [ -z "$CLEAN_EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is missing. Add it in GitHub Settings → Secrets and variables → Actions."
            exit 1
          fi

          if printf "%s" "$CLEAN_EXPO_TOKEN" | grep -q '[[:space:]]'; then
            echo "EXPO_TOKEN contains whitespace. Re-save the secret with only the raw token value."
            exit 1
          fi

          echo "::add-mask::$CLEAN_EXPO_TOKEN"
          echo "EXPO_TOKEN=$CLEAN_EXPO_TOKEN" >> "$GITHUB_ENV"
          echo "EXPO_TOKEN is present and normalized."
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update (production)
        if: github.ref == 'refs/heads/main'
        run: eas update --channel production --message "$UPDATE_MESSAGE" --non-interactive
        env:
          UPDATE_MESSAGE: ${{ github.event.head_commit.message }}

      - name: Publish OTA update (preview)
        if: github.ref == 'refs/heads/preview'
        run: eas update --channel preview --message "$UPDATE_MESSAGE" --non-interactive
        env:
          UPDATE_MESSAGE: ${{ github.event.head_commit.message }}
